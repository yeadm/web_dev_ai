<!doctype html>
<html lang="en">
  <>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이벤트</title>
    <link rel="stylesheet" href="./08-event.css" />
     

    <!-- defer은 DOMContentLoaded와 같은 효과 -->
    <script src="./08-event.js" defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body>



    <h1>이벤트</h1>
    <h2>클릭 이벤트</h2>
    <section>
      <div class="box" id="click">click!</div>
      <div class="box" id="double">Double click!</div>
      <div class="box" id="right">right click!</div>
      <div class="box" id="hover">Hover!</div>
      <div id="mouseDot"></div>

      <h2> 스크롤 이벤트</h2>
      <div ID="wheel"> 휠을 움직여보세요!</div>
      <div ID="scroll"></div>


      <h2>키보드 이벤트</h2>
      <input type="text" id="key">
      <p id=" keyResult"></p>
      <div class="movebox"></div>

    </section>
<h2> 모달</h2>
<button id="openModal">모달 열기</button>
<div class="modal-overlay" id="modal-overlay">
<div class="modal-box">
    <h3>모달제목</h3>
    <p>모달 내용입니다. 배경(어두운 부분)을 클릭하면 닫혀요!</p>
    <button id="closemodal">닫기</button>
</div> 

<h2> 모달(apline)</h2>
<button id="openModal">모달 열기</button>
<div class="modal-overlay">
<div class="modal-box">
    <h3>모달제목</h3>
    <p>모달 내용입니다. 배경(어두운 부분)을 클릭하면 닫혀요!</p>
    <button id="closemodal">닫기</button>
</div> 


</div>

<h2>탭 전환</h2>
<div x-data="{tab:'a'}">
    <button>소개</button>
    <button>예약</button>
<h2>아코디언</h2>
<div x-data="{open:null}">
    <div>
        <button class="accordion-header" 
        : class="{active:open===0}" 
            @click=""open===open===0? null ; 0">
            섹션1</button>
            
        
    </div>
    <div><button>
            <div class=""accordion-body"
            :class="{open: open === 0}"
            x-show="open === 0">
            섹션 1 내용입니다.</div>
        </button></div>


</div>

<h2>슬라이드</h2>

</body>
</html>
