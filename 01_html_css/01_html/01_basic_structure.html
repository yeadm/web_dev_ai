<!--<태그 속성 ="값"> 내용 </태그>-->
<!doctype html>
<!--현재 문서가 HTML5언어로 작성된 웹 문서-->
<html lang="ko"> <!--웹문서의 시작과 끝-->
<!--lang : 문서 언어지정 (en : 영어, ko : 한국어)-->    
<head>
        <!--웹문서의 정보-->
        <title>문서제목</title>
        <meta charset="utf-8">
        <meta name="description" content="문서 설명 여기에 작성합니다.">
        <meta name="author" content="문서 작성자">
        <!--모바일 화면 설정 
        -width=device-width : 화면 너비에 맞춤
        inital-scale=1.0 초기 확대 비율
        viewport-fit=cover : 노치(전면 카메라와 센서부분)까지 화면 사용
        -->
        <meta name="viewport">
        <!--open graph 공유카드 : 카카오톡 등 링크 공유할 때 미리보기-->
        <meta property="og:title" content="">
         <meta property="og:description" content="문서 설명">
        <meta property="og:image" content="페이지 화면 이미지">
        <meta property="og:url" content="현재 페이지 url 주소">
        
        <!--파비콘 설정 : .ico, .png, .svg-->
        <link rel="icon" href="../01_html/assets/favicon.png">

    </head>
    <body>
        <!-- 실제 웹 브라우저에 나타나는 내용-->
         안녕하세요! 오늘 2026년 9월 7일 이네요. 좋은아침입니다.
    </body>
</html>
