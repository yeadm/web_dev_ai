<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>실습-폼</title>
  </head>
  <body>
    <h1>넷째바오 100일 잔치 참석 신청서</h1>
    <p>2026년 9월 11일, 에버랜드 판다월드에서 열립니다.</p>
    <form action="">이름 <input name="이름" type="text" /></form>
    <br />
    <form action="">
      연락처 <input name="연락처" type="text" placeholder="010-0000-0000" />
    </form>
    <br />
    <form action="">이메일 <input name="이메일" type="text" name="" /></form>

    <br />

    <form action="">
      넷째바오와의 관계
      <select name="관계">
        <option disabled selected>선택해주세요</option>
        <option value="">가족(바오패밀리)</option>
        <option value="">친구</option>
        <option value="">판다유치원 선생님</option>
        <option value="">팬</option>
      </select>
    </form>

    <br />
    <form action="">
      <fieldset>
        <legend>참석 여부</legend>
        <label><input type="radio" value="참석" name="참석"/> 참석</label>
        <label><input type="radio" value="불참" name="" /> 불참</label>
      </fieldset>
      <fieldset>
        <legend>준비해 올 선물</legend>
        <label><input type="checkbox" />대나무 </label>
        <label><input type="checkbox" />죽순 </label>
        <label><input type="checkbox" />장난감 </label>
        <label><input type="checkbox" />사진기 </label>
      </fieldset>
    </form>
    <br />
    <form action="">도착 예정 시간 <input type="time" /></form>
    <br />
    <form action="">축하메시지 <textarea name="memo" id=""></textarea></form>
    <br />

    <button type="submit">신청하기</button>
  </body>
</html>
