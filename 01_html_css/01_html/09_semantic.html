<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시맨틱 태그</title>
</head>
<body>
    <h2>시맨틱 태그</h2>
    <!-- 시맨틱 태그를 사용하는 이유는 웹 접근성+seo
     *웹 접근성: 눈으로 직접 보지 않고 어떤 기기든 환경에서든 누구나 콘텐츠를 쓸 수 있도록
     *SEO: 검색엔진(구글, 네이버)이 내 페이지를 이해할 수 있도록 하기 위해서 -->
    <header>
        <!-- header 머리말, nav 메뉴묶음 -->
        <h1>logo</h1>
        <nav>GNB</nav>
    </header>
    <main>
        <!-- main 핵심본문 (페이지당 딱 1개만 사용하는 편) -->
         <!-- section/article 주제별 구획 -->
         <section></section>
         <article></article>
         <div id="" class=""></div>
    </main>
    <aside>
        <!-- aside 본문에서 벗어난 내용 (사이드바-광고) -->
    </aside>
    <footer>
        <!-- footer 회사소개, copyright -->
         <address>
            <!-- adress 연락처, 이메일, 주소, 전화번호 -->
         </address>
    </footer>

</body>
</html>
