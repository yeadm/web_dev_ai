<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <link rel="stylesheet" href="./08_grid.css">
</head>
<body>
    <h1>Grid</h1>
    <p>display : grid</p>
    <p>2단 레이아웃 스타일</p>
    <h2>grid-template-columns/ rows</h2>
    <div class="grid template">
       <div class="item">1</div>
       <div class="item">2</div>
       <div class="item">3</div>
       <div class="item">4</div>
       <div class="item">5</div>
       <div class="item">6</div>
    </div>

      <h2>grid-template-column/ grid-row</h2>
    <div class="grid cr">
       <div class="item column">1</div>
       <div class="item row">2</div>
       <div class="item">3</div>
       <div class="item">4</div>
       <div class="item">5</div>
       <div class="item">6</div>
    </div>

    <h2>grid-template-ateas </h2>
    <grid class="grid area">
        <div class="item header"> </div>
         <div class="item nav"></div>
        <div class="item main"></div>
         <div class="item section"></div>
         <div class="item footer"></div>
        </div>
    </grid>

    <h2>auto-fit/ auto-fill</h2>
    <div class="grid fit">
       <div class="item">1</div>
       <div class="item">2</div>
       <div class="item">3</div>
       <div class="item">4</div>
       <div class="item">5</div>
       <div class="item">6</div>
    </div>

       <h2>auto-fit/ auto-fill</h2>
    <div class="grid fill">
       <div class="item">1</div>
       <div class="item">2</div>
       <div class="item">3</div>
       <div class="item">4</div>
       <div class="item">5</div>
       <div class="item">6</div>
    </div>

    <h2>alligh-items/ justfy-contents</h2>
    <div class="grid item">
       <div class="item">1</div>
       <div class="item">2</div>
       <div class="item">3</div>
       <div class="item">4</div>
       <div class="item">5</div>
       <div class="item">6</div>
    </div>

    <h2>alligh-items/ justfy-contents</h2>
    <div class="grid content">
       <div class="item">1</div>
       <div class="item">2</div>
       <div class="item">3</div>
       <div class="item">4</div>
       <div class="item">5</div>
       <div class="item">6</div>
       </div>

</body>
</html>
