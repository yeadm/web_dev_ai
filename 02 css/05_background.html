<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배경</title>
    <link rel="stylesheet" href="./05_background.css">
</head>
<body>
    <h1>배경</h1>
    <h2>backgroun-color</h2>
    <div class="box bg-color"></div>

    <h2>background-image</h2>
    <div class="box pic"></div>

    <h2>background-repeat:no-repeat + position:center</h2>
    <div class="box pic bg-norepeat"></div>

    <h2>background-size : cover</h2>
    <div class="box pic bg-cover"></div>

    <h2>background-attachment:fixed</h2>
    <div class="box pic bg-fixed"></div>

    <h2>gradient</h2>
    <div class="box bg-gradient"></div>

    <h2>사진+투명검정</h2>
    <div class="box bg-overlay"></div>

    <h2>blend-mode 색+사진 섞기</h2>
    <div class="box bg-blend"></div>

    <h2>background 축약형</h2>
    <box class="bg"></box>


</body>
</html>
